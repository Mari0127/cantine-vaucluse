<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Éco-Délégués - Vaucluse</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e8f5e9; display: flex; justify-content: center; padding: 20px; }
        .container { background-color: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #2e7d32; }
        .poubelle { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        input { width: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; color: white; margin-top: 10px; }
        .btn-calcul { background-color: #4caf50; }
        .btn-save { background-color: #2196F3; }
        .resultat-box { margin-top: 20px; padding: 15px; background-color: #f1f8e9; border-left: 5px solid #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Suivi du Gaspillage</h1>
    <p style="text-align:center;"><strong>Espace Éco-Délégués</strong><br>Collège du Vaucluse</p>
    
    <div class="poubelle">
        <label>Ton prénom :</label>
        <input type="text" id="prenom" placeholder="Prénom">
    </div>
    
    <hr>

    <div class="poubelle"><label>Alimentaire :</label><input type="number" id="alimentaire" value="0"> kg</div>
    <div class="poubelle"><label>Serviettes :</label><input type="number" id="serviettes" value="0"> kg</div>
    <div class="poubelle"><label>Emballages :</label><input type="number" id="emballages" value="0"> kg</div>
    <div class="poubelle"><label>Fruits :</label><input type="number" id="fruits" value="0"> kg</div>
    <div class="poubelle"><label>Pain :</label><input type="number" id="pain" value="0"> kg</div>

    <button class="btn-calcul" onclick="calculerTotal()">Calculer l'impact du jour</button>

    <div class="resultat-box">
        <p id="resultat">En attente des mesures...</p>
    </div>

    <button class="btn-save" onclick="enregistrerDonnees()">💾 Enregistrer dans le tableau</button>
</div>

<script>
    function calculerTotal() {
        let prenom = document.getElementById('prenom').value || "L'éco-délégué";
        let alim = parseFloat(document.getElementById('alimentaire').value) || 0;
        let serv = parseFloat(document.getElementById('serviettes').value) || 0;
        let emb = parseFloat(document.getElementById('emballages').value) || 0;
        let fru = parseFloat(document.getElementById('fruits').value) || 0;
        let p = parseFloat(document.getElementById('pain').value) || 0;

        let total = alim + serv + emb + fru + p;
        let parEleve = (total / 700) * 1000;

        document.getElementById('resultat').innerHTML = 
            "Bravo " + prenom + " !<br>Total : <strong>" + total.toFixed(2) + " kg</strong><br>" +
            "Soit " + parEleve.toFixed(0) + "g par élève.";
    }

    function enregistrerDonnees() {
        alert("Action réussie ! (Pour que l'enregistrement fonctionne réellement, il faudra lier un Google Form plus tard).");
    }
</script>

</body>
</html>
