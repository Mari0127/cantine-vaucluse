<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi ODD - Collège Vaucluse (Cantine Giono)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e8f5e9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background-color: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 900px; width: 100%; }
        h1, h2 { text-align: center; color: #2e7d32; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; font-size: 0.9rem; margin-bottom: 20px; }
        
        .loading-box { background: #e3f2fd; color: #0d47a1; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; font-size: 0.8rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #2e7d32; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        
        .chart-container { margin-top: 30px; position: relative; width: 100%; height: 380px; }
        .btn-refresh { background-color: #0288d1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; display: block; margin: 20px auto 0 auto; }
        .btn-refresh:hover { background-color: #01579b; }
        
        .section-titre { margin-top: 25px; padding-bottom: 5px; border-bottom: 2px solid #2e7d32; color: #2e7d32; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Suivi Complet Consommations & Déchets</h1>
    <p class="subtitle">Défi Carbone Haut Vaucluse — Cantine Giono</p>
    
    <div id="loading" class="loading-box">🔄 Connexion au nouveau Google Sheets...</div>

    <div style="text-align: center; margin-bottom: 20px; background: #f1f8e9; padding: 12px; border-radius: 8px;">
        <label style="font-weight: bold;">📅 Sélectionner la vue temporelle : </label>
        <select id="selectFiltre" onchange="traiterEtAfficherDonnees()" style="padding: 6px; border-radius: 5px; font-weight: bold; cursor: pointer;">
            <option value="jours">Affichage par Jours (Semaine)</option>
            <option value="mois">Affichage par Mois (Année)</option>
        </select>
    </div>

    <div class="section-titre">📈 Tableau récapitulatif (Direct Google Sheets)</div>
    <div style="overflow-x: auto;">
        <table id="tableauRecap">
            <thead>
                <tr>
                    <th>Période</th>
                    <th>V. Rouge</th>
                    <th>V. Blanche</th>
                    <th>Végétarien</th>
                    <th>Poissons</th>
                    <th>Pain</th>
                    <th>Fruits</th>
                    <th>Emballages</th>
                    <th>Déchets Alim.</th>
                    <th>Serviettes</th>
                </tr>
            </thead>
            <tbody id="corpsTableau">
                </tbody>
        </table>
    </div>

    <div class="section-titre">📊 Graphique d'Analyse global</div>
    <div class="chart-container">
        <canvas id="graphiqueAnalyse"></canvas>
    </div>

    <button class="btn-refresh" onclick="chargerDonneesGoogleSheets()">🔄 Actualiser les données</button>
</div>

<script>
    // Identifiant de ton NOUVEAU Google Sheets !
    const sheetsId = "1LBx4npRIgii_-Uh3lKXNyUmt7R8l27dQrhWHRTzPqj0";
    const sheetName = "CANTINE GIONO"; 
    const urlCSV = `https://docs.google.com/spreadsheets/d/${sheetsId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

    const listesJours = ["Lundi", "Mardi", "Jeudi", "Vendredi"];
    const listesMois = ["Sept", "Oct", "Nov", "Dec", "Janv", "Fev", "Mars", "Avril", "Mai", "Juin"];

    let donneesGlobalesBrutes = [];
    let monGraphique = null;

    window.onload = chargerDonneesGoogleSheets;

    function chargerDonneesGoogleSheets() {
        document.getElementById('loading').style.display = "block";
        
        fetch(urlCSV)
            .then(response => response.text())
            .then(data => {
                extraireDonneesCSV(data);
                traiterEtAfficherDonnees();
            })
            .catch(error => {
                console.error("Erreur :", error);
                document.getElementById('loading').innerHTML = "❌ Erreur. Vérifie le partage du fichier Excel (Tous les utilisateurs disposant du lien) !";
            });
    }

    function extraireDonneesCSV(texteCSV) {
        donneesGlobalesBrutes = [];
        let lignes = texteCSV.split('\n');

        for (let i = 1; i < lignes.length; i++) {
            if (lignes[i].trim() === "") continue;
            
            let cellules = lignes[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
            
            if (cellules.length >= 10) {
                let periode = cellules[0]; // Col A
                let vRouge = parseFloat(cellules[1]) || 0;  // Col B
                let vBlanche = parseFloat(cellules[2]) || 0; // Col C
                let veget = parseFloat(cellules[3]) || 0;    // Col D
                let poisson = parseFloat(cellules[4]) || 0;  // Col E
                let pain = parseFloat(cellules[5]) || 0;     // Col F
                let fruits = parseFloat(cellules[6]) || 0;   // Col G
                let emb = parseFloat(cellules[7]) || 0;      // Col H
                let dechets = parseFloat(cellules[8]) || 0;  // Col I
                let serv = parseFloat(cellules[9]) || 0;     // Col J

                if (periode) {
                    donneesGlobalesBrutes[periode] = { vRouge, vBlanche, veget, poisson, pain, fruits, emb, dechets, serv };
                }
            }
        }
    }

    function traiterEtAfficherDonnees() {
        document.getElementById('loading').style.display = "none";
        let filtre = document.getElementById('selectFiltre').value;
        let corps = document.getElementById('corpsTableau');
        corps.innerHTML = "";
        
        let periodesAffichees = (filtre === "jours") ? listesJours : listesMois;
        let donneesPourGraphique = [];

        periodesAffichees.forEach(p => {
            let d = donneesGlobalesBrutes[p] || { vRouge: 0, vBlanche: 0, veget: 0, poisson: 0, pain: 0, fruits: 0, emb: 0, dechets: 0, serv: 0 };
            
            donneesPourGraphique.push({ periode: p, ...d });

            corps.innerHTML += `
                <tr>
                    <td><strong>${p}</strong></td>
                    <td>${d.vRouge}</td>
                    <td>${d.vBlanche}</td>
                    <td>${d.veget}</td>
                    <td>${d.poisson}</td>
                    <td>${d.pain} kg</td>
                    <td>${d.fruits} kg</td>
                    <td>${d.emb} kg</td>
                    <td>${d.dechets.toFixed(1)} kg</td>
                    <td>${d.serv.toFixed(1)} kg</td>
                </tr>`;
        });

        genererGraphique(donneesPourGraphique);
    }

    function genererGraphique(donnees) {
        let ctx = document.getElementById('graphiqueAnalyse').getContext('2d');
        if (monGraphique !== null) { monGraphique.destroy(); }

        let labels = donnees.map(d => d.periode);

        monGraphique = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '🔴 V. Rouge', data: donnees.map(d => d.vRouge), backgroundColor: 'rgba(239, 83, 80, 0.75)' },
                    { label: '🍗 V. Blanche', data: donnees.map(d => d.vBlanche), backgroundColor: 'rgba(255, 167, 38, 0.75)' },
                    { label: '🌱 Végétarien', data: donnees.map(d => d.veget), backgroundColor: 'rgba(102, 187, 106, 0.75)' },
                    { label: '🐟 Poissons', data: donnees.map(d => d.poisson), backgroundColor: 'rgba(41, 182, 246, 0.75)' },
                    { label: '🥖 Pain (kg)', data: donnees.map(d => d.pain), backgroundColor: 'rgba(212, 172, 13, 0.75)' },
                    { label: '🍏 Fruits (kg)', data: donnees.map(d => d.fruits), backgroundColor: 'rgba(139, 195, 74, 0.75)' },
                    { label: '📦 Emballages (kg)', data: donnees.map(d => d.emb), backgroundColor: 'rgba(141, 110, 99, 0.75)' },
                    { label: '🗑️ Déchets Alim.', data: donnees.map(d => d.dechets), backgroundColor: 'rgba(120, 144, 156, 0.75)' },
                    { label: '🧻 Serviettes', data: donnees.map(d => d.serv), backgroundColor: 'rgba(171, 71, 188, 0.75)' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, title: { display: true, text: 'Quantités' } } }
            }
        });
    }
</script>

</body>
</html>
